name: Schuettflix
description: >-
  Schuettflix is a German digital logistics platform for the construction
  industry, founded in 2018 in Guetersloh. It operates a neutral B2B
  marketplace that connects construction companies, bulk-material suppliers,
  freight forwarders and waste-disposal firms in a single fully digital
  workflow. Through its iOS and Android apps, customers order sand, gravel and
  crushed stone with transparent real-time pricing, coordinate dispatch and
  transport, capture delivery documentation, manage routes, and handle
  mineral-waste disposal and circular-economy recycling of construction
  materials. The company digitizes the traditionally analog and fragmented
  process of procuring and delivering bulk goods, earning a commission on the
  transactions facilitated through its platform. It was surfaced as a portfolio
  company of Speedinvest. No public developer API, developer portal, or
  machine-readable API specification was found during enrichment.
